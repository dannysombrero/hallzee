version: 2
updates:
  - package-ecosystem: pip
    directory: /firmware
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-maintenance:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-maintenance:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /preview-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      react:
        patterns: ["react", "react-dom", "react-server-dom-webpack", "@types/react", "@types/react-dom"]
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "miniflare"]
      npm-maintenance:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories:
      - /receiver/universal
      - /receiver/universal.tests
      - /receiver/MacBLEAgent
      - /receiver/windows
      - /receiver/windows/BathroomSync.Core
      - /receiver/windows/BathroomSync.Tests
      - /tools/FirmwareTool
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      sqlite:
        patterns: ["Microsoft.Data.Sqlite*", "SQLitePCLRaw.*", "SourceGear.sqlite3"]
      dotnet-maintenance:
        patterns: ["*"]
