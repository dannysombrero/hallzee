name: Build Universal Sync Client
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/validate-release-inputs.py
      - test/test_release_inputs.py
      - scripts/publish-release.py
      - scripts/package-client-macos.sh
      - test/test_publish_release.py
      - .github/workflows/release-client.yml
      - .github/workflows/publish-release.yml
      - receiver/universal/**
      - receiver/universal.tests/**
      - receiver/windows/**
      - tools/FirmwareTool/**
      - firmware/release-public-key.pem
      - .github/workflows/build-universal-client.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test release input validation
        run: python3 -m unittest discover -s test -p test_release_inputs.py

      - name: Test release publication without network or credentials
        run: python3 -m unittest discover -s test -p test_publish_release.py

      - name: Run Universal client tests
        run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj --configuration Release

      - name: Build firmware package and USB tool
        run: dotnet build tools/FirmwareTool/FirmwareTool.csproj --configuration Release

      - name: Build Universal client
        run: dotnet build receiver/universal/BathroomSync.Universal.csproj --configuration Release

  publish_windows_client:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows Universal client
        run: >
          dotnet publish receiver/universal/BathroomSync.Universal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output publish

      - name: Upload Windows client
        uses: actions/upload-artifact@v6
        with:
          name: HallzeeSync-Universal-Windows
          path: publish/
          if-no-files-found: error
