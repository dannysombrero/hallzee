nname: Build Universal Sync Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - receiver/universal/**
      - receiver/universal.tests/**
      - receiver/windows/**
      - .github/workflows/build-universal-client.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Universal client tests
        run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj --configuration Release

      - name: Build Universal client
        run: dotnet build receiver/universal/BathroomSync.Universal.csproj --configuration Release

  publish_windows_client:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows Universal client
        run: >
          dotnet publish receiver/universal/BathroomSync.Universal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output publish

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: HallzeeSync-Universal-Windows
          path: publish/
          if-no-files-found: error
