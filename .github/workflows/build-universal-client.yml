name: Build Universal Sync Client
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desktop-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test release input validation
        run: python3 -m unittest discover -s test -p test_release_inputs.py

      - name: Test release publication without network or credentials
        run: python3 -m unittest discover -s test -p test_publish_release.py

      - name: Run Universal client tests
        run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj --configuration Release

      - name: Run database, protocol, and native SQLite tests
        run: dotnet test receiver/windows/BathroomSync.Tests/BathroomSync.Tests.csproj --configuration Release

      - name: Build firmware package and USB tool
        run: dotnet build tools/FirmwareTool/FirmwareTool.csproj --configuration Release

      - name: Build Universal client
        run: dotnet build receiver/universal/BathroomSync.Universal.csproj --configuration Release

  mac_package:
    name: Mac package (${{ matrix.rid }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Select supported macOS SDK and install workload
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          sudo xcode-select --switch "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo "$(command -v dotnet)" workload install macos
      - name: Verify complete app, native helper, notices, and ad-hoc signatures
        env:
          CLIENT_RID: ${{ matrix.rid }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: bash scripts/package-client-macos.sh 0.0.0 "$CLIENT_RID" "$RELEASE_REPOSITORY" packaged

  publish_windows_client:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Build Universal Sync Client'
    needs: [validate, mac_package]
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows Universal client
        run: >
          dotnet publish receiver/universal/BathroomSync.Universal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output publish

      - name: Include this runtime's dependency notices
        run: python3 scripts/generate-dependency-inventory.py --no-npm --rid win-x64 --assets receiver/universal/obj/project.assets.json --publish-dir publish --notices publish/licenses/nuget --output publish/licenses/dependency-inventory.json

      - name: Upload Windows client
        uses: actions/upload-artifact@v6
        with:
          name: HallzeeSync-Universal-Windows
          path: publish/
          if-no-files-found: error
