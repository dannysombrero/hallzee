name: Build Windows Sync App
on:
  workflow_dispatch:
  push:
    branches: [windows-sync-client]
    paths: [receiver/windows/**, .github/workflows/build-windows-sync.yml]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test receiver/windows/BathroomSync.Tests/BathroomSync.Tests.csproj --configuration Release -p:CollectCoverage=true -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total
      - run: dotnet publish receiver/windows/BathroomSync.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - uses: actions/upload-artifact@v4
        with: { name: BathroomSync-Windows, path: publish/BathroomSync.Windows.exe }
