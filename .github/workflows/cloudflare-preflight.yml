name: Check Cloudflare deployment access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'dannysombrero/hallzee'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify diagnostics and repository hygiene
        run: |
          python3 -m unittest discover -s test -p test_cloudflare_preflight.py
          python3 -m unittest discover -s test -p test_repo_hygiene.py
      - name: Check Pages, Workers and DNS without changing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-preflight.py
      - name: Check public DNS and relay health without credentials
        run: |
          node --input-type=module <<'JS'
          import { resolve4, resolveNs } from 'node:dns/promises';
          const category = error => /^[A-Z_]{3,40}$/.test(error.cause?.code || error.code || '')
            ? (error.cause?.code || error.code) : 'CONNECTION_UNAVAILABLE';
          for (const host of ['web.hallzee.com', 'pass.hallzee.com', 'relay.hallzee.com']) {
            try {
              const addresses = await resolve4(host);
              console.log(JSON.stringify({host, public_dns_resolves: addresses.length > 0}));
            } catch (error) { console.log(JSON.stringify({host, dns_error: category(error)})); }
          }
          try {
            const nameservers = await resolveNs('hallzee.com');
            console.log(JSON.stringify({cloudflare_nameservers: nameservers.every(n => n.endsWith('.ns.cloudflare.com'))}));
            const response = await fetch('https://relay.hallzee.com/health', {signal: AbortSignal.timeout(10000)});
            const body = await response.json().catch(() => null);
            console.log(JSON.stringify({relay_http_status: response.status,
              cloudflare_challenge: response.headers.get('cf-mitigated') === 'challenge',
              redirected: response.redirected, expected_health_service: body?.service === 'hallzee-relay'}));
          } catch (error) { console.log(JSON.stringify({public_relay_error: category(error)})); }
          JS
