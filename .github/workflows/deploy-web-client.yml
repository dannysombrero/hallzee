name: Deploy web client to Cloudflare

on:
  push:
    branches:
      - main
      # One-time authorized rollout; remove this branch after deployment.
      - codex/cloudflare-terminal-deploy
    paths:
      - 'web-client/**'
      - 'relay/**'
      - 'scripts/cloudflare-*.py'
      - 'scripts/verify-relay.mjs'
      - '.github/workflows/deploy-web-client.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      dry_run:
        description: 'Dry run (build and test without deploying)'
        required: false
        default: false
        type: boolean
      deploy_relay:
        description: 'Also publish the relay (ends active ephemeral rooms)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-web-client-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select coordinated relay deployment
        id: relay
        working-directory: .
        env:
          REQUESTED: ${{ inputs.deploy_relay || false }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          selected = os.environ['REQUESTED'] == 'true'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              before = event.get('before', '')
              if before and set(before) != {'0'}:
                  paths = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
              else:
                  paths = ['relay/']
              selected |= any(p.startswith('relay/') or p.startswith('scripts/cloudflare-')
                              or p in {'scripts/verify-relay.mjs', '.github/workflows/deploy-web-client.yml'} for p in paths)
          selected &= os.environ['TARGET_ENVIRONMENT'] == 'production'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('deploy=' + str(selected).lower(), file=output)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run verification checks (typecheck, lint, unit & browser tests)
        run: npm run check

      - name: Verify domain setup safeguards
        working-directory: .
        run: |
          python3 -m unittest discover -s test -p 'test_cloudflare*.py'
          python3 -m unittest discover -s test -p test_repo_hygiene.py

      - name: Validate Worker bundle
        if: steps.relay.outputs.deploy == 'true'
        working-directory: .
        run: npx --yes wrangler@4.140.0 deploy --dry-run --config relay/wrangler.jsonc

      - name: Test the real local Workers runtime
        if: steps.relay.outputs.deploy == 'true'
        working-directory: .
        run: |
          npx --yes wrangler@4.140.0 dev --local --config relay/wrangler.jsonc --port 8787 --persist-to "$RUNNER_TEMP/relay-state" > "$RUNNER_TEMP/relay-dev.log" 2>&1 &
          HALLZEE_LOCAL_RELAY_PID=$!
          trap 'kill "$HALLZEE_LOCAL_RELAY_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Local Workers runtime did not start.')
          PY
          HALLZEE_RELAY_ORIGIN=http://127.0.0.1:8787 node scripts/verify-relay.mjs

      - name: Build production distribution bundle
        env:
          PRODUCTION_ORIGIN: 'https://web.hallzee.com'
        run: npm run build

      - name: Package reviewed static artifact
        id: package
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          ARTIFACT="Hallzee-Web-${VERSION}-${GITHUB_SHA:0:12}"
          cd dist
          zip -qr "../${ARTIFACT}.zip" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: web-client/${{ steps.package.outputs.artifact }}.zip
          if-no-files-found: error
          overwrite: true

      - name: Verify Cloudflare deployment secrets
        if: ${{ !inputs.dry_run }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secrets."
            echo "Configure these secrets in GitHub Settings -> Secrets and variables -> Actions."
            echo "Refer to docs/web-client-deployment.md for setup instructions."
            exit 1
          fi

      - name: Determine deployment branch tag
        id: branch_tag
        run: |
          if [ "${{ inputs.environment }}" = "preview" ]; then
            echo "branch=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check production account and plan student hostname
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/cloudflare-preflight.py
          python3 scripts/cloudflare-bind-join.py
          python3 scripts/cloudflare-bind-join.py --relay

      - name: Deploy matching room relay
        if: ${{ !inputs.dry_run && steps.relay.outputs.deploy == 'true' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.140.0 deploy --config relay/wrangler.jsonc --keep-vars

      - name: Bind relay custom domain
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-bind-join.py --relay --apply

      - name: Verify production relay protocol
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' }}
        working-directory: .
        run: node scripts/verify-relay.mjs

      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry_run }}
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: pages deploy dist --project-name=hallzee-web-client --branch=${{ steps.branch_tag.outputs.branch }} --commit-dirty=true
          workingDirectory: web-client

      - name: Bind and activate student hostname
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-bind-join.py --apply --wait

      - name: Verify the public teacher and student flow
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' }}
        run: npx --no-install playwright test --config playwright.deployment.config.ts

      - name: Save public-flow verification screenshots
        if: ${{ !inputs.dry_run && steps.branch_tag.outputs.branch == 'main' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: public-terminal-verification
          path: web-client/test-results/deployment-*.png
          if-no-files-found: error
          overwrite: true

      - name: Record deployment summary
        run: |
          echo "### 🚀 Web Client Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Origin**: [https://web.hallzee.com](https://web.hallzee.com)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch Tag**: \`${{ steps.branch_tag.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry Run**: \`${{ inputs.dry_run || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
