name: Legacy Windows Build (use Build Desktop Release Packages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test receiver/windows/BathroomSync.Tests/BathroomSync.Tests.csproj --configuration Release
      - run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj --configuration Release
      - run: dotnet publish receiver/universal/BathroomSync.Universal.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - name: Package the app
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath BathroomSync-Windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: BathroomSync-Windows-Latest
          path: BathroomSync-Windows.zip
          if-no-files-found: error
