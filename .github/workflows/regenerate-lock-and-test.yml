name: Prepare preview dependency update

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regenerate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Update the lockfile within declared version ranges
        working-directory: preview-site
        run: |
          npm update --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=low

      - name: Run tests
        working-directory: preview-site
        run: |
          npm test

      - name: Run lint
        working-directory: preview-site
        run: |
          npm run lint
          npx --no-install tsc --noEmit

      - name: Prepare a reviewable patch
        run: |
          git diff --binary -- preview-site/package-lock.json > dependency-update.patch
      - name: Download and apply on a contributor branch
        uses: actions/upload-artifact@v6
        with:
          name: preview-dependency-update
          path: |
            dependency-update.patch
            preview-site/package-lock.json
          if-no-files-found: error
