name: Regenerate preview lockfile and run tests

on:
  push:
    branches:
      - 'refactor/react-client-shell'
  workflow_dispatch: {}

jobs:
  regenerate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate preview-site package-lock and install
        working-directory: preview-site
        run: |
          rm -f package-lock.json
          npm ci

      - name: Run tests
        working-directory: preview-site
        run: |
          npm test

      - name: Run lint
        working-directory: preview-site
        run: |
          npm run lint

      - name: Commit regenerated package-lock.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-site/package-lock.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate package-lock.json for preview-site (auto)"
            git push origin HEAD:refactor/react-client-shell
          else
            echo "No changes to package-lock.json"
          fi
