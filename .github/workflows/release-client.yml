name: Build Desktop Release Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version (1.0.0 or v1.0; short versions become 1.0.0)
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      repository: ${{ steps.inputs.outputs.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Test release input validation
        run: python3 -m unittest discover -s test -p test_release_inputs.py
      - name: Validate version and destination
        id: inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ vars.HALLZEE_RELEASE_REPOSITORY || github.repository }}
        run: python3 scripts/validate-release-inputs.py
  build:
    needs: prepare
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ needs.prepare.outputs.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
          - os: macos-14
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test receiver/windows/BathroomSync.Tests/BathroomSync.Tests.csproj -c Release
      - run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj -c Release
      - name: Select Xcode for the macOS 15 SDK
        if: runner.os == 'macOS'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          sudo xcode-select --switch "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: |
          dotnet --version
          sudo "$(command -v dotnet)" workload install macos
      - name: Package Mac app with Bluetooth helper
        if: runner.os == 'macOS'
        env:
          CLIENT_RID: ${{ matrix.rid }}
        run: bash scripts/package-client-macos.sh "$RELEASE_VERSION" "$CLIENT_RID" "$RELEASE_REPOSITORY" packaged
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish receiver/universal/BathroomSync.Universal.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false "-p:Version=$env:RELEASE_VERSION" "-p:ReleaseRepository=$env:RELEASE_REPOSITORY" -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item packaged -ItemType Directory
          Compress-Archive publish/* packaged/Hallzee-Windows-win-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: Desktop-${{ matrix.rid }}
          path: packaged/*.zip
          if-no-files-found: error
  metadata:
    needs: [prepare, build]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ needs.prepare.outputs.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record version, destination, source, and teacher guide
        run: |
          mkdir metadata
          python3 -c 'import json,os; json.dump(dict(product="client",version=os.environ["RELEASE_VERSION"],repository=os.environ["RELEASE_REPOSITORY"],sha=os.environ["GITHUB_SHA"]),open("metadata/release.json","w"))'
          cp docs/getting-started-users.md metadata/teacher-guide.md
          cp docs/client-release-notes.md metadata/notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: Release-metadata
          path: metadata/
          if-no-files-found: error
