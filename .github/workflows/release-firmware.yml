name: Build Firmware Release Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version (1.0.0 or v1.0; must be newer than installed terminals)
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      repository: ${{ steps.inputs.outputs.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Test release input validation
        run: python3 -m unittest discover -s test -p test_release_inputs.py
      - name: Validate version and destination
        id: inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ vars.HALLZEE_RELEASE_REPOSITORY || github.repository }}
        run: python3 scripts/validate-release-inputs.py
  test:
    needs: prepare
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test receiver/windows/BathroomSync.Tests/BathroomSync.Tests.csproj
      - run: dotnet test receiver/universal.tests/BathroomSync.Universal.Tests.csproj
      - if: runner.os == 'macOS'
        run: make -C test coverage
  build:
    needs: [prepare, test]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    environment: firmware-release
    steps:
      - name: Check firmware signing secret
        env:
          RELEASE_KEY: ${{ secrets.HALLZEE_FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo '::error::Missing HALLZEE_FIRMWARE_SIGNING_KEY. In repository Settings > Environments > firmware-release, add an environment secret with this name containing the existing private PEM key. See docs/firmware-updates.md. This is unrelated to paid desktop publisher signing.'
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned firmware tools
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          libraries=()
          while IFS= read -r library; do
            [[ -z "$library" || "$library" == \#* ]] || libraries+=("$library")
          done < firmware/arduino-libraries.txt
          arduino-cli lib install --no-deps "${libraries[@]}"
      - name: Build and sign packages
        env:
          RELEASE_KEY: ${{ secrets.HALLZEE_FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_KEY" || { echo 'Configure HALLZEE_FIRMWARE_SIGNING_KEY in the firmware-release environment.'; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$RUNNER_TEMP/release-key.pem"' EXIT
          python3 scripts/build-firmware-release.py --version "$RELEASE_VERSION" --build "$GITHUB_SHA" --output artifacts/firmware --key "$RUNNER_TEMP/release-key.pem" --notes firmware/release-notes.md --arduino-data "$HOME/.arduino15"
      - uses: actions/upload-artifact@v6
        with:
          name: Firmware-and-USB-images
          path: artifacts/firmware/
          if-no-files-found: error
  usb:
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: Firmware-and-USB-images
          path: firmware-build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: arduino/setup-arduino-cli@v2
      - shell: bash
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Validate USB migration without hardware
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dotnet build tools/FirmwareTool/FirmwareTool.csproj
          python3 test/test_usb_bootstrap.py --mklittlefs "$HOME/Library/Arduino15/packages/esp32/tools/mklittlefs/4.0.2-db0513a/mklittlefs"
      - name: Publish the exact USB runtime after simulator restores
        shell: bash
        env:
          USB_RID: ${{ matrix.rid }}
        run: dotnet publish tools/FirmwareTool/FirmwareTool.csproj -c Release -r "$USB_RID" --self-contained true -o usb/tool
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build standalone USB esptool with locked dependencies and sources
        run: python scripts/build-usb-esptool.py --output usb/tool --licenses usb/licenses/python --sources usb-python-sources
      - name: Audit every locked Python dependency
        run: python scripts/audit-usb-python.py --output python-audit.json
      - name: Bundle USB tools
        shell: pwsh
        run: |
          $data = if ($IsWindows) { "$env:LOCALAPPDATA/Arduino15" } else { "$HOME/Library/Arduino15" }
          Copy-Item "$data/packages/esp32/tools/mklittlefs/4.0.2-db0513a/*" usb/tool -Recurse -Force
          New-Item -ItemType Directory -Path usb/images -Force | Out-Null
          Copy-Item firmware-build/USB-* usb/images -Recurse
          Copy-Item firmware-build/licenses usb/ -Recurse
          Copy-Item firmware-build/SOURCE-AND-LICENSES.md usb/
          python3 scripts/generate-dependency-inventory.py --no-npm --rid '${{ matrix.rid }}' --assets tools/FirmwareTool/obj/project.assets.json --publish-dir usb/tool --notices usb/tool/licenses/nuget --output usb/tool/licenses/dependency-inventory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/install-usb-* usb/
          Copy-Item scripts/recover-usb-* usb/
          Copy-Item firmware/USB-README.md usb/README.md
          Compress-Archive usb/* "Hallzee-USB-${{ matrix.rid }}.zip"
          Move-Item usb-python-sources/Hallzee-USB-Python-Sources.zip "Hallzee-USB-Python-Sources-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: USB-${{ matrix.rid }}
          path: Hallzee-USB-*.zip
  metadata:
    needs: [prepare, build, usb]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ needs.prepare.outputs.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record version, destination, source, and teacher guide
        run: |
          mkdir metadata
          python3 -c 'import json,os; json.dump(dict(product="firmware",version=os.environ["RELEASE_VERSION"],repository=os.environ["RELEASE_REPOSITORY"],sha=os.environ["GITHUB_SHA"]),open("metadata/release.json","w"))'
          cp docs/getting-started-users.md metadata/teacher-guide.md
          cp firmware/release-notes.md metadata/notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: Release-metadata
          path: metadata/
          if-no-files-found: error
