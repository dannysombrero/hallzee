name: Validate Firmware and BLE Protocol
on:
  workflow_dispatch:
  push:
    paths: &firmware_paths
      - "*.ino"
      - "*.cpp"
      - "*.h"
      - "test/**"
      - ".github/workflows/validate-firmware.yml"
  pull_request:
    paths: *firmware_paths

jobs:
  native_tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C test coverage

  firmware_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install firmware libraries
        run: arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "Keypad"
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 .
