name: Validate Firmware and BLE Protocol
on:
  workflow_dispatch:
  pull_request:
    paths: &firmware_paths
      - "*.ino"
      - "*.cpp"
      - "*.h"
      - "test/**"
      - ".github/workflows/validate-firmware.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native_tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: make -C test coverage

  firmware_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Install firmware libraries
        run: arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "Adafruit ILI9341" "Keypad"
      - name: Compile ST7735 firmware
        run: |
          mkdir -p "$RUNNER_TEMP/hallzee"
          cp ./*.cpp ./*.h "$RUNNER_TEMP/hallzee/"
          cp bathroom-signin.ino "$RUNNER_TEMP/hallzee/hallzee.ino"
          arduino-cli compile --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/hallzee"
      - name: Compile ILI9341 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/hallzee" --build-property "compiler.cpp.extra_flags=-DHALLZEE_ILI9341 -DHALLZEE_DISPLAY_ROTATION=1"
