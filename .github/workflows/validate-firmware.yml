name: Validate Firmware and BLE Protocol
on:
  workflow_dispatch:
  pull_request:
    paths: &firmware_paths
      - "*.ino"
      - "*.cpp"
      - "*.h"
      - "test/**"
      - "tools/FirmwareTool/**"
      - "firmware/**"
      - "scripts/flash-terminal*"
      - "scripts/build-firmware-release.py"
      - ".github/workflows/validate-firmware.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast_usb_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build tools/FirmwareTool/FirmwareTool.csproj
      - run: python3 test/test_usb_fast.py
      - run: python3 -m unittest discover -s test -p test_repo_hygiene.py
      - run: bash -n scripts/flash-terminal-macos.sh
      - name: Parse Windows flash script
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/flash-terminal-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors -join "`n") }

  native_tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: make -C test coverage

  firmware_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Install firmware libraries
        run: arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "Adafruit ILI9341" "Keypad"
      - name: Compile ST7735 firmware
        run: |
          mkdir -p "$RUNNER_TEMP/hallzee"
          cp ./*.cpp ./*.h "$RUNNER_TEMP/hallzee/"
          cp bathroom-signin.ino "$RUNNER_TEMP/hallzee/hallzee.ino"
          cp -R fonts "$RUNNER_TEMP/hallzee/"
          cp firmware/partitions.csv "$RUNNER_TEMP/hallzee/"
          arduino-cli compile --build-property upload.maximum_size=1572864 --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/hallzee"
      - name: Compile ILI9341 firmware
        run: arduino-cli compile --build-property upload.maximum_size=1572864 --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/hallzee" --build-property "compiler.cpp.extra_flags=-DHALLZEE_ILI9341 -DHALLZEE_DISPLAY_ROTATION=1"
      - name: Compile optional touch experiment (both landscape orientations)
        run: |
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
          for rotation in 1 3; do
            arduino-cli compile --build-property upload.maximum_size=1572864 --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/hallzee" --build-property "compiler.cpp.extra_flags=-DHALLZEE_ILI9341 -DHALLZEE_DISPLAY_ROTATION=$rotation -DHALLZEE_TOUCH_TEST"
          done
